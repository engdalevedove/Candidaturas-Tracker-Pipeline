name: Sync Candidaturas Pipeline

on:
  schedule:
    - cron: '0 12,21 * * *' # 09:00 e 18:00 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar pipeline
        env:
          CI: "true"
          TWOCAPTCHA_API_KEY: ${{ secrets.TWOCAPTCHA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HOTMAIL_1_EMAIL: ${{ secrets.HOTMAIL_1_EMAIL }}
          HOTMAIL_1_PASS: ${{ secrets.HOTMAIL_1_PASS }}
          HOTMAIL_2_EMAIL: ${{ secrets.HOTMAIL_2_EMAIL }}
          HOTMAIL_2_PASS: ${{ secrets.HOTMAIL_2_PASS }}
        run: python main.py

      - name: Commit banco SQLite e CSV do BI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/applications.db exports/candidaturas_bi.csv
          git commit -m "chore: atualiza status de candidaturas [skip ci]" || exit 0
          git push