name: Sync Candidaturas Pipeline

on:
  schedule:
    # Roda todos os dias às 08:30 e 18:30 (horário de Brasília = 11:30 e 21:30 UTC)
    - cron: "30 11 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Garantir diretórios de dados e exportação
        run: |
          mkdir -p data exports

      - name: Executar pipeline de coleta e consolidação
        env:
          CI: "true"
          GUPY_COOKIE: ${{ secrets.GUPY_COOKIE }}
          SOLIDES_BEARER_TOKEN: ${{ secrets.SOLIDES_BEARER_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HOTMAIL_1_EMAIL: ${{ secrets.HOTMAIL_1_EMAIL }}
          HOTMAIL_1_PASS: ${{ secrets.HOTMAIL_1_PASS }}
          HOTMAIL_2_EMAIL: ${{ secrets.HOTMAIL_2_EMAIL }}
          HOTMAIL_2_PASS: ${{ secrets.HOTMAIL_2_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
