name: Sync Candidaturas Pipeline

on:
  schedule:
    # Roda todos os dias às 08:30 e 18:30 (horário de Brasília = 11:30 e 21:30 UTC)
    - cron: "30 11 * * *"
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Garantir diretórios de dados e exportação
        run: |
          mkdir -p data exports

      - name: Executar pipeline de coleta e consolidação
        env:
          CI: "true"
          GUPY_COOKIE: ${{ secrets.GUPY_COOKIE }}
          SOLIDES_BEARER_TOKEN: ${{ secrets.SOLIDES_BEARER_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          HOTMAIL_1_EMAIL: ${{ secrets.HOTMAIL_1_EMAIL }}
          HOTMAIL_1_PASS: ${{ secrets.HOTMAIL_1_PASS }}
          HOTMAIL_2_EMAIL: ${{ secrets.HOTMAIL_2_EMAIL }}
          HOTMAIL_2_PASS: ${{ secrets.HOTMAIL_2_PASS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Publicar CSV analítico atualizado (se houver alteração)
        run: |
          if [ -f "exports/candidaturas_bi.csv" ]; then
            cp exports/candidaturas_bi.csv /tmp/candidaturas_bi_novo.csv
            git fetch origin main
            git reset --hard origin/main
            mkdir -p exports
            cp /tmp/candidaturas_bi_novo.csv exports/candidaturas_bi.csv
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f exports/candidaturas_bi.csv
            if ! git diff --staged --quiet; then
              git commit -m "chore(data): atualiza base analitica candidaturas_bi.csv [skip ci]"
              git push origin main
            else
              echo "Nenhuma novidade para commitar."
            fi
          fi
